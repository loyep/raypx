packages:
  - apps/*
  - packages/**
  - tooling/*

autoInstallPeers: false
preferWorkspacePackages: true

onlyBuiltDependencies:
  - esbuild
  - lefthook
  - msw
  - sharp

peerDependencyRules:
  allowAny:
    - vite
  ignoreMissing:
    - mssql
    - "@types/mssql"
  allowedVersions:
    vite: "*"

updateConfig:
  ignoreDependencies:
    - "@types/node"

overrides:
  esbuild: ^0.27.3
  '@opentelemetry/api-logs': 0.213.0
  '@opentelemetry/core': 2.6.0
  '@opentelemetry/instrumentation': 0.213.0
  '@rolldown/pluginutils': 1.0.0-rc.7
  rolldown: 1.0.0-rc.7
  srvx: 0.11.8
  vite: "catalog:beta"
  '@vitejs/plugin-react': "catalog:"

catalog:
  '@tanstack/devtools-vite': ^0.5.3
  '@tanstack/react-devtools': ^0.9.10
  '@tanstack/react-query': ^5.90.21
  '@tanstack/react-query-devtools': ^5.91.3
  '@tanstack/react-router': ^1.166.2
  '@tanstack/react-router-devtools': ^1.166.2
  '@tanstack/react-start': ^1.166.2
  '@types/node': 24.10.4
  '@vitest/coverage-v8': ^4.0.18
  '@vitejs/plugin-react': ^5.1.4
  babel-plugin-react-compiler: ^1.0.0
  jiti: ^2.6.1
  recharts: ^3.8.0
  type-fest: ^5.4.4
  typescript: ^5.9.3
  vitest: ^4.0.18
  zod: ^4.3.6

catalogs:
  beta:
    nitro: ^3.0.1-alpha.2
    tsdown: ^0.21.0
    vite: ^8.0.0-beta.16
    drizzle-kit: beta
    drizzle-orm: beta
    drizzle-seed: beta
    drizzle-zod: beta
  react19:
    '@types/react': ^19.2.14
    '@types/react-dom': ^19.2.3
    react: ^19.2.4
    react-dom: ^19.2.4
  tailwindv4:
    '@tailwindcss/vite': ^4.2.1
    tailwindcss: ^4.2.1
